<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>

    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 600px;
            height: 300px;
            border: 2px solid black;
            margin: 50px auto;
        }

        #dragBox {
            position: absolute;
            width: 80px;
            height: 80px;
            background: royalblue;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: grab;
            user-select: none;
        }
    </style>
</head>

<body>

    <!-- HTML -->
    <div id="container">
        <div id="dragBox">Drag Me</div>
    </div>


    <!-- JavaScript -->
    <script>
        const dragBox = document.getElementById("dragBox");
        const container = document.getElementById("container");

        let isDragging = false;

        dragBox.addEventListener("mousedown", () => {
            isDragging = true;
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
        });

        container.addEventListener("mousemove", (e) => {

            if (!isDragging) {
                return;
            }

            const rect = container.getBoundingClientRect();

            let x = e.clientX - rect.left - dragBox.offsetWidth / 2;
            let y = e.clientY - rect.top - dragBox.offsetHeight / 2;

            // Keep box inside container
            x = Math.max(
                0,
                Math.min(x, rect.width - dragBox.offsetWidth)
            );

            y = Math.max(
                0,
                Math.min(y, rect.height - dragBox.offsetHeight)
            );

            dragBox.style.left = x + "px";
            dragBox.style.top = y + "px";
        });
    </script>

</body>
</html>
